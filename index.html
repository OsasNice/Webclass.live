
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Class Coverage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      text-align: center;
      padding-top: 100px;
    }
    h1 {
      color: #222;
    }
    .box {
      background-color: white;
      padding: 40px;
      border-radius: 10px;
      width: 80%;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    .surprise {
      font-size: 24px;
      color: crimson;
      margin-top: 20px;
      animation: shake 1s infinite;
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Live Class Coverage Loading...</h1>
    <p>Buffering video feed from classroom...</p>
    <p class="surprise">April Fooooool! You don late, bro/sis!</p>
    <p style="margin-top: 30px;">Next time, waka come class early before you miss assignment & update.</p>
    <p style="font-size: 12px; color: gray;">— Powered by Osas the Sharp Guy</p>
  </div>
</body>
</html>
